[project]
name = "reservoirs-web"
version = "0.1.0"
description = "Web version of the reservoirs_bot project: hydrological data on Russian HPP reservoirs"
requires-python = ">=3.11,<3.12"
dependencies = [
    "beautifulsoup4==4.12.2",
    "celery==5.2.7",
    "django==4.0.6",
    "django-celery-beat==2.5.0",
    "django-celery-results==2.5.0",
    "django-environ==0.10.0",
    "django-filter==23.1",
    "djangorestframework==3.14.0",
    "drf-nested-routers==0.93.4",
    "drf-yasg==1.21.5",
    "gunicorn==20.1.0",
    "httpx==0.24.0",
    # CUDA runtime-библиотеки для torch==2.0.0. pip ставил их автоматически
    # как зависимости torch, а uv в lock их не прописывает (зависимости torch
    # с маркерами platform_system/platform_machine теряются при резолве),
    # поэтому зафиксированы явно. Без них `import torch` падает с
    # ValueError: libcublas.so not found. Маршрут: tasks.py -> forecasting.py.
    # Без маркеров: проект собирается и работает только на Linux x86_64.
    "nvidia-cublas-cu11==11.10.3.66",
    "nvidia-cuda-cupti-cu11==11.7.101",
    "nvidia-cuda-nvrtc-cu11==11.7.99",
    "nvidia-cuda-runtime-cu11==11.7.99",
    "nvidia-cudnn-cu11==8.5.0.96",
    "nvidia-cufft-cu11==10.9.0.58",
    "nvidia-curand-cu11==10.2.10.91",
    "nvidia-cusolver-cu11==11.4.0.1",
    "nvidia-cusparse-cu11==11.7.4.91",
    "nvidia-nccl-cu11==2.14.3",
    "nvidia-nvtx-cu11==11.7.91",
    "psycopg2-binary==2.9.6",
    "pydantic==1.10.7",
    "python-dateutil==2.8.2",
    "python-docx==0.8.11",
    "pytorch-forecasting==1.0.0",
    # Нужен celery/kombu (брокер и result backend — redis://) и встроенному
    # Django-бэкенду django.core.cache.backends.redis.RedisCache.
    # Раньше ставился транзитивно через django-redis.
    "redis==4.5.4",
    "selenium==4.9.0",
    "setuptools==67.7.2",
]

[dependency-groups]
dev = [
    "django-extensions",
    "flake8",
    "ipykernel",
    "pytest",
    "pytest-django",
    "python-dotenv",
    "werkzeug",
]

[tool.uv]
package = false
# Транзитивные зависимости зафиксированы на версиях из старого
# requirements.txt (pip freeze, май 2023), чтобы переезд на uv не менял
# runtime-окружение. Ослабление/обновление — через `uv lock --upgrade`.
constraint-dependencies = [
    "aiohttp==3.8.4",
    "aiosignal==1.3.1 ; python_version >= '3.7'",
    "alembic==1.10.4 ; python_version >= '3.7'",
    "amqp==5.1.1 ; python_version >= '3.6'",
    "anyio==3.6.2 ; python_full_version >= '3.6.2'",
    "arrow==1.2.3 ; python_version >= '3.6'",
    "asgiref==3.6.0 ; python_version >= '3.7'",
    "async-generator==1.10 ; python_version >= '3.5'",
